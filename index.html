<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="description" content="A verified, searchable ledger of Michael Kushman's job applications.">
<title>Job Hunt — Michael Kushman</title>
<style>
/* ---------- palette: dark only, no light branch ---------- */
:root {
  --bg: #0f1115; --card: #171a21; --line: #262b36;
  --text: #e8eaf0; --dim: #9aa3b2; --dimmer: #6b7383;

  /* semantic status colours — fixed, never reused for decoration.
     red and green sit at ΔE 6.5 for deuteranopic readers, under the safe
     threshold, so status ALWAYS carries its text label and count as well. */
  --red:    #f87171;  /* rejected / declined            */
  --amber:  #fbbf24;  /* submitted, never acknowledged  */
  --blue:   #60a5fa;  /* submitted ✓, confirmed         */
  --green:  #34d399;  /* a human engaged                */
  --grey:   #8b93a3;  /* bounced or withdrawn           */
  --purple: #c084fc;  /* cold outreach, no posted role  */
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "Segoe UI", Arial, sans-serif;
  padding: 24px; max-width: 1180px; margin: 0 auto;
}
h1 { font-size: 20px; letter-spacing: -0.02em; }
.sub { color: var(--dim); font-size: 12px; margin: 4px 0 20px; }
a { color: var(--blue); }
code { font: 12px/1 ui-monospace, Menlo, Consolas, monospace; color: var(--text); }

/* ---------- scoreboard tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin-bottom: 22px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile .n { font-size: 24px; font-weight: 700; }
.tile .l { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.tile.hero { border-color: color-mix(in srgb, var(--green) 45%, var(--line)); }
.tile.hero .n { color: var(--green); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.tabs button {
  font: inherit; font-size: 13px; font-weight: 600; color: var(--dim);
  background: none; border: 1px solid transparent; border-bottom: none;
  border-radius: 10px 10px 0 0; padding: 9px 14px; cursor: pointer; margin-bottom: -1px;
}
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); background: var(--card); border-color: var(--line); }
.tabs button:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.tabs .count { color: var(--dimmer); font-weight: 500; }
[role="tabpanel"]:focus { outline: none; }

/* ---------- section headings + tables ---------- */
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 26px 0 10px; }
h2:first-child { margin-top: 0; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
.co { font-weight: 600; white-space: nowrap; }
.co a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
.co a:hover { color: var(--blue); }
.role { color: var(--dim); font-size: 12.5px; }
.sal { white-space: nowrap; font-variant-numeric: tabular-nums; }
.note { color: var(--dim); font-size: 12px; }
.wrap-x { overflow-x: auto; }

/* ---------- status chips ---------- */
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.k-rejected  { background: color-mix(in srgb, var(--red) 15%, transparent);    color: var(--red); }
.k-submitted { background: color-mix(in srgb, var(--amber) 15%, transparent);  color: var(--amber); }
.k-confirmed { background: color-mix(in srgb, var(--blue) 15%, transparent);   color: var(--blue); }
.k-engaged   { background: color-mix(in srgb, var(--green) 18%, transparent);  color: var(--green); }
.k-bounced   { background: color-mix(in srgb, var(--grey) 18%, transparent);   color: var(--grey); }
.k-cold      { background: color-mix(in srgb, var(--purple) 15%, transparent); color: var(--purple); }

/* ---------- figures / charts (HTML+CSS bars, never SVG) ---------- */
.fig { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 18px; margin-bottom: 16px; }
.fig h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 600; margin-bottom: 14px; }
.cap { color: var(--dim); font-size: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }

/* a) column chart — applications per day */
.cols { display: flex; align-items: flex-end; gap: 10px; height: 150px; }
.col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 5px; min-width: 0; }
.col .v { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.col .bar { width: 100%; background: var(--blue); border-radius: 4px 4px 0 0; min-height: 3px; }
.coldates { display: flex; gap: 10px; margin-top: 7px; }
.coldates div { flex: 1; text-align: center; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 0; }

/* b) one stacked bar + labelled legend */
.stack { display: flex; height: 30px; border-radius: 6px; overflow: hidden; background: var(--bg); }
.stack .seg { min-width: 3px; }
.legend { list-style: none; margin-top: 14px; display: grid; gap: 8px; padding: 0; }
.legend li { display: flex; gap: 9px; align-items: baseline; font-size: 12.5px; }
.legend .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; position: relative; top: 1px; }
.legend .n { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 2.2em; }
.legend .lab { font-weight: 600; }
.legend .mean { color: var(--dim); }
.legend .none { color: var(--dimmer); font-style: italic; }

/* c) ranked horizontal bars */
.hbars { display: grid; gap: 9px; }
.hbar { display: grid; grid-template-columns: 200px 1fr 44px; gap: 10px; align-items: center; font-size: 12.5px; }
.hbar .track { background: var(--bg); border-radius: 5px; height: 20px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--blue); border-radius: 5px; min-width: 2px; }
.hbar.unrec .fill { background: var(--grey); }
.hbar .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 620px) { .hbar { grid-template-columns: 120px 1fr 36px; } }

/* ---------- callouts ---------- */
.note-box { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: 8px; padding: 12px 16px; color: var(--dim); font-size: 12.5px; margin-top: 22px; }
.note-box b { color: var(--text); }
.note-box.quiet { border-left-color: var(--grey); }
.headline { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: 8px; padding: 14px 18px; margin-bottom: 18px; font-size: 13.5px; }
.headline b { color: var(--green); }
.updated { color: var(--dim); font-size: 11px; margin-top: 16px; }
.checked { color: var(--dimmer); }

/* ---------- glossary tab ---------- */
.gloss-group { margin-bottom: 26px; }
.gloss-group h2 { margin-bottom: 12px; }
.gloss-list { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.gloss-item { padding: 11px 14px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 210px 1fr; gap: 14px; }
.gloss-item:last-child { border-bottom: none; }
.gloss-item dt { font-weight: 600; }
.gloss-item dd { color: var(--dim); margin: 0; }
@media (max-width: 620px) { .gloss-item { grid-template-columns: 1fr; gap: 4px; } }

/* ---------- glossary term trigger + tooltip ---------- */
.term { border-bottom: 1px dashed var(--dimmer); cursor: help; }
.term:hover, .term:focus-visible { border-bottom-color: var(--blue); color: var(--text); outline: none; }
.term:focus-visible { box-shadow: 0 0 0 2px color-mix(in srgb, var(--blue) 55%, transparent); border-radius: 2px; }
/* fixed + appended to <body>: the tables use overflow:hidden and would clip an
   absolutely-positioned tooltip */
#tip {
  position: fixed; z-index: 999; max-width: 320px;
  background: #0b0d11; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font-size: 12.5px; line-height: 1.45; color: var(--text);
  box-shadow: 0 10px 30px rgba(0,0,0,.55); pointer-events: none;
}
#tip[hidden] { display: none; }
#tip .t { display: block; font-weight: 700; margin-bottom: 3px; }
#tip .d { color: var(--dim); }
.loading { color: var(--dim); }
.err { color: var(--red); }
</style>
</head>

<div id="app"><p class="loading">Loading tracker…</p></div>
<div id="tip" role="tooltip" hidden></div>

<script>
/* ============================================================
   GLOSSARY — source of truth for the page tooltips AND for the
   generated .xlsx / .pdf, which extract this literal by regex:
       const GLOSSARY = ({...});
   Keep it valid JSON so those consumers can json.loads() it.
   ============================================================ */
const GLOSSARY = {
 "How an application travels": [
  {"term": "ATS", "aliases": ["applicant tracking system", "applicant tracking systems"], "definition": "The software a company uses to collect and sort applications. Ashby, Greenhouse, Lever, Workday and iCIMS are the ones that turn up most often on this page."},
  {"term": "ATS confirmation", "aliases": ["automated confirmation", "confirmation email", "application confirmation", "application receipt"], "definition": "The automatic email their system sends the moment an application lands. It proves the file arrived; it does not mean a person has opened it."},
  {"term": "portal", "aliases": ["portals", "candidate portal", "application portal"], "definition": "A company's own web page where you type in your history and upload a résumé instead of emailing anyone. Most of them make you retype everything that is already on the résumé you just attached."},
  {"term": "req", "aliases": ["reqs", "requisition", "requisitions", "job requisition"], "definition": "The internal ticket saying a company has the budget to pay one more person, usually with a number attached. No req, no job — even if the posting is still up."},
  {"term": "autoresponder", "aliases": ["auto-reply", "autoreply", "auto-ack", "canned ack", "automated receipt", "automatic reply"], "definition": "A pre-written reply that fires the second your message arrives, sometimes within seconds. It tells you the machine is working, and nothing about your chances."},
  {"term": "no-reply", "aliases": ["noreply", "no-reply address", "do-not-reply", "donotreply"], "definition": "An address that can send mail but cannot receive it, so answering it goes nowhere. To reach an actual person you have to find their real address yourself."},
  {"term": "bounced", "aliases": ["bounce", "bounces", "bounced back", "hard bounce"], "definition": "The message never reached anyone — the address was wrong or dead and the mail system sent it back. Notes here that say “no bounce” mean the opposite: it arrived."},
  {"term": "cold email", "aliases": ["cold emails", "cold outreach", "cold emailed", "cold-emailed"], "definition": "Writing straight to someone at a company that never posted the job you want. It is not rude, and at small companies it is often how hiring actually starts."},
  {"term": "referral", "aliases": ["referrals", "referred", "internal referral"], "definition": "Someone inside the company passes your name along, which lifts you out of the pile and in front of a human. It is the biggest single advantage in hiring, and the main reason two people with the same experience get very different results."}
 ],
 "Who you are talking to": [
  {"term": "recruiter", "aliases": ["recruiters", "in-house recruiter"], "definition": "The person whose job is to find candidates and move them through the steps. They are not the one who decides, and they are usually juggling dozens of openings at once."},
  {"term": "Talent Partner", "aliases": ["talent partners", "talent acquisition partner", "talent acquisition"], "definition": "A recruiter with a warmer job title. Same work: finding people, booking calls, and sending the yes or the no."},
  {"term": "agency", "aliases": ["agencies", "recruiting agency", "staffing agency", "agency recruiter", "external recruiter"], "definition": "An outside firm that finds candidates for other companies and is paid only when someone is hired. They can be genuinely helpful, but the company is the one paying them, not you."},
  {"term": "hiring manager", "aliases": ["hiring managers"], "definition": "The person you would actually work for, and the one who decides. Everyone before them is a filter."},
  {"term": "hotlist", "aliases": ["hot list", "talent pool", "talent community"], "definition": "A list of people a company says it will remember when something opens up. Saying it costs them nothing, and almost nobody is ever contacted from one."}
 ],
 "Stages": [
  {"term": "Submitted", "aliases": ["submitted, no reply"], "definition": "Sent, and nothing has come back — no receipt, no rejection, not a word. This is where most rows on this page sit."},
  {"term": "Submitted ✓", "aliases": ["confirmed received"], "definition": "Their system sent back a receipt, so the application is known to have arrived. The mark shows where a row stands today, so two applications that later turned into a rejection or a conversation no longer carry it."},
  {"term": "screen", "aliases": ["phone screen", "recruiter screen", "screening call", "initial screen"], "definition": "A short first call, usually twenty or thirty minutes with a recruiter, to check the basics. It is a gate, not really an interview."},
  {"term": "take-home", "aliases": ["take home", "take-home assignment", "take-home project", "take home test"], "definition": "A piece of real work you do alone, on your own time, unpaid, and send back. Reasonable ones take an evening; unreasonable ones eat a weekend."},
  {"term": "loop", "aliases": ["interview loop", "onsite loop", "final loop", "onsite interviews"], "definition": "The final round: several interviews back to back, often in one day, with different people. Afterwards they compare notes and decide together."},
  {"term": "Conversation", "aliases": ["live conversation", "live conversations", "conversations"], "definition": "A real person wrote back and a genuine back-and-forth started. It is the rarest status on this page."},
  {"term": "Rejected", "aliases": ["rejection", "rejections", "declined", "passed on"], "definition": "They said no. Sometimes it arrives as a form letter, occasionally as a real note from a real person."},
  {"term": "in pipeline", "aliases": ["pipeline", "in the pipeline"], "definition": "Applications still alive in some form — sent, confirmed, or being talked about — with no final answer yet. Silence keeps a row here until it is plainly dead."},
  {"term": "backlog", "aliases": ["in backlog", "moved from backlog"], "definition": "Jobs worth applying to that have not gone out yet. Keeping them separate is what stops good intentions from being counted as work done."}
 ],
 "Money and ownership": [
  {"term": "base", "aliases": ["base salary", "base pay"], "definition": "The cash salary, before anything else is added on. It is the only part you can actually count on."},
  {"term": "equity", "aliases": ["eq", "equity grant", "ownership stake"], "definition": "A slice of ownership in the company, handed over instead of some of the cash. It is worth nothing unless the company is later sold or goes public."},
  {"term": "options", "aliases": ["stock options", "share options", "option grant"], "definition": "The right to buy company shares later at a price fixed today. If the company grows you buy cheap; if it does not, you simply never buy."},
  {"term": "vesting", "aliases": ["vest", "vests", "vested", "vesting schedule"], "definition": "You earn your equity gradually, month by month, rather than receiving it on day one. Leave early and you keep only the part you have earned so far."},
  {"term": "cliff", "aliases": ["one-year cliff", "1-year cliff", "vesting cliff"], "definition": "A waiting period, usually a full year, before any equity is yours at all. Leave a day before it and you walk away with none of it."},
  {"term": "OTE", "aliases": ["on-target earnings", "on target earnings"], "definition": "Salary plus the bonus you would earn if you hit every target. Read it as the best case, not as the offer."},
  {"term": "comp", "aliases": ["compensation", "total comp", "comp package", "total compensation"], "definition": "Everything you are paid — salary, bonus, equity and benefits — added into one number. Companies quote the big total; the cash part is the part that pays rent."}
 ],
 "Where work happens": [
  {"term": "Remote", "aliases": ["remote US", "fully remote", "remote-first", "remote global", "remote worldwide", "work from home"], "definition": "You work from where you live. Read the fine print — remote usually still means a particular country, and often specific hours overlapping someone else's day."},
  {"term": "Hybrid", "aliases": ["hybrid schedule", "part remote"], "definition": "Some days in the office, the rest at home, with the split set by the company rather than by you. Listings here spell it out, like three days a week."},
  {"term": "On-site", "aliases": ["onsite", "in-person", "in person", "in the office"], "definition": "You are expected in the building, most days or every day. For these jobs that usually means living near New York or San Francisco."}
 ],
 "Role titles": [
  {"term": "Design Engineer", "aliases": ["design engineers", "design technologist", "creative technologist"], "definition": "Someone who designs how a thing looks and behaves, then writes the code that makes it real. Some companies call the same job design technologist or creative technologist."},
  {"term": "Founding Engineer", "aliases": ["founding engineers", "founding design engineer", "founding designer", "founding member of technical staff", "member of technical staff"], "definition": "One of the first few people building the product, before there are teams, managers or process. More ownership and more equity, with no guarantee the company lasts."},
  {"term": "Product Engineer", "aliases": ["product engineers"], "definition": "An engineer trusted to decide what to build, not only how to build it, working close to the people who use it. The opposite of being handed a finished spec."},
  {"term": "Full-Stack", "aliases": ["full stack", "fullstack", "full-stack engineer", "full stack engineer", "full-stack developer"], "definition": "Able to work on the part people see and the machinery behind it. At a small company it usually just means everything."}
 ],
 "Startup vocabulary": [
  {"term": "YC", "aliases": ["Y Combinator", "YCombinator"], "definition": "Y Combinator, the best known startup program: it gives brand-new companies a little money and three months of coaching in exchange for a piece of them. Tags like S24 or F25 say which batch a company came through."},
  {"term": "WaaS", "aliases": ["Work at a Startup"], "definition": "Work at a Startup, Y Combinator's own job board for the companies it has funded. A few of the applications here went out through it."},
  {"term": "accelerator", "aliases": ["accelerators", "startup accelerator", "incubator"], "definition": "A short program that funds a group of new companies, coaches them, and ends with them pitching investors. Y Combinator is the famous one."},
  {"term": "Ashby", "aliases": [], "definition": "One of the systems companies use to take in applications, common at startups. Its automatic receipt is what puts the check mark on many rows here."},
  {"term": "Greenhouse", "aliases": [], "definition": "Another widely used application system, more common at bigger companies. Its receipt sometimes leaves the job title out, which is why a couple of rows here say the role was not stated."},
  {"term": "iCIMS", "aliases": [], "definition": "An older application system, used mostly by large established employers. It produced the first rejection of this campaign."},
  {"term": "Polymer", "aliases": [], "definition": "A smaller, newer application system used by one company on this list. Same purpose as the rest: take applications in and sort them."}
 ],
 "What the polite phrases actually mean": [
  {"term": "moving forward with other candidates", "aliases": ["move forward with other candidates", "moving forward with others", "decided to move forward with other candidates", "pursuing other candidates"], "definition": "This is a no. It is the standard phrasing for a rejection, and it does not mean a decision is still open."},
  {"term": "not a great fit", "aliases": ["not a fit", "not a good fit", "not the right fit", "not quite the right fit", "not a fit for the current role"], "definition": "Also a no, usually a kind one. It rarely means anything specific about you, and asking what was missing almost never gets an answer."},
  {"term": "keep you on our hotlist", "aliases": ["keeping him on their hotlist", "keeping you on our hotlist", "on our hotlist", "keep you on file", "keep your resume on file", "keep your résumé on file"], "definition": "A gentle way to end things without saying never. It costs nothing to say and rarely leads anywhere, so treat it as a no with the door left ajar."},
  {"term": "we'll be in touch", "aliases": ["we’ll be in touch", "we will be in touch", "we'll be in touch soon", "be in touch"], "definition": "On its own, this means nothing. With a date or a named next step attached it is real; without one, expect silence."},
  {"term": "reach out", "aliases": ["reach back out", "reaching out", "we’ll reach out", "we'll reach out"], "definition": "Office language for “get in touch”. When they say they will reach out, no promise has been made; when you do it yourself, it is the part of a job hunt that actually works."},
  {"term": "circle back", "aliases": ["circling back", "circle back with you", "come back to you"], "definition": "To return to something later. In hiring it nearly always means no decision is being made today, and often none is ever made."}
 ]
};

/* ---------- status: one semantic map, used everywhere ---------- */
const STATUS = {
  rejected:  { color: 'var(--red)',    label: 'Rejected',            mean: 'They said no.' },
  submitted: { color: 'var(--amber)',  label: 'Submitted, no reply', mean: 'Sent. Nobody has acknowledged it.' },
  confirmed: { color: 'var(--blue)',   label: 'Confirmed received',  mean: 'Their system said it arrived.' },
  engaged:   { color: 'var(--green)',  label: 'A human engaged',     mean: 'Someone actually replied and talked.' },
  bounced:   { color: 'var(--grey)',   label: 'Never arrived',       mean: 'Bounced or withdrawn before it landed.' },
  cold:      { color: 'var(--purple)', label: 'Cold outreach',       mean: 'No posted job; introduced myself anyway.' }
};
const STATUS_ORDER = ['engaged','confirmed','submitted','rejected','bounced','cold'];

function statusKey(status){
  const s = (status || '').toLowerCase();
  if (s.includes('bounced') || s.includes('withdrawn')) return 'bounced';
  if (s.includes('rejected') || s.includes('declined')) return 'rejected';
  if (['conversation','screen','interview','offer','loop','take-home','onsite'].some(w => s.includes(w))) return 'engaged';
  if (s.includes('cold') || s.includes('emailed')) return 'cold';
  if ((status || '').includes('✓')) return 'confirmed';
  return 'submitted';
}

/* how the application was sent — read from the note, first match wins.
   note: many notes say "delivered; no bounce", which is NOT a bounce —
   status is never inferred from note text. */
const CHANNELS = [
  [/direct email|cold email|emailed/i,                                          'Direct email'],
  [/work at a startup|\bwaas\b|ycombinator|\byc\b/i,                             'YC board'],
  [/greenhouse|ashby|lever|workday|icims|polymer|rippling|wellfound|paraform/i,  'Company application system'],
  [/google form|applied via|application submitted|application form|web form|portal|careers page/i, 'Web form']
];
const UNRECORDED = 'Not recorded';
function channel(note){
  for (const [re, name] of CHANNELS) if (re.test(note || '')) return name;
  return UNRECORDED;
}

/* ---------- text helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* flatten the glossary into one matcher, longest surface first so multi-word
   phrases win over their own substrings */
const TERMS = [];
for (const [group, items] of Object.entries(GLOSSARY))
  for (const it of items) {
    const surfaces = [it.term, ...(it.aliases || [])]
      .map(s => String(s).replace(/^[“"']+|[”"']+$/g, '').trim())
      .filter(Boolean);
    for (const s of surfaces) TERMS.push({ surface: s, term: it.term, definition: it.definition, group });
  }
TERMS.sort((a, b) => b.surface.length - a.surface.length);

const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
/* one alternation, one pass: replace() scans the ORIGINAL string, so nothing
   can re-match inside the markup we insert */
const TERM_RX = TERMS.length
  ? new RegExp('(?<![A-Za-z0-9])(' + TERMS.map(t => rxEsc(t.surface)).join('|') + ')(?![A-Za-z0-9])', 'gi')
  : null;
const BY_SURFACE = new Map(TERMS.map(t => [t.surface.toLowerCase(), t]));

/* IMPORTANT: only ever called on text that is ALREADY HTML-escaped, so the
   markup added here is the only markup in the string. */
function annotate(escaped){
  if (!TERM_RX) return escaped;
  return escaped.replace(TERM_RX, (m) => {
    const hit = BY_SURFACE.get(m.toLowerCase());
    if (!hit) return m;
    return '<span class="term" tabindex="0" role="button" aria-label="' + esc(hit.term) + ' — what this means"' +
           ' data-term="' + esc(hit.term) + '" data-def="' + esc(hit.definition) + '">' + m + '</span>';
  });
}
const ann = s => annotate(esc(s));

/* ---------- tooltip: fixed + appended to body so tables cannot clip it ---------- */
const tip = document.getElementById('tip');
let tipEl = null;
function placeTip(){
  if (!tipEl) return;
  const r = tipEl.getBoundingClientRect(), box = tip.getBoundingClientRect();
  let left = r.left + r.width / 2 - box.width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - box.width - 8));
  let top = r.top - box.height - 8;
  if (top < 8) top = r.bottom + 8;          // flip below when there is no room above
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function showTip(el){
  tipEl = el;
  tip.textContent = '';
  const t = document.createElement('span'); t.className = 't'; t.textContent = el.dataset.term;
  const d = document.createElement('span'); d.className = 'd'; d.textContent = el.dataset.def;
  tip.append(t, d);
  tip.hidden = false;
  placeTip();
}
function hideTip(){ tip.hidden = true; tipEl = null; }
document.addEventListener('mouseover', e => { const t = e.target.closest('.term'); if (t) showTip(t); });
document.addEventListener('mouseout',  e => { const t = e.target.closest('.term'); if (t && t === tipEl) hideTip(); });
document.addEventListener('focusin',   e => { const t = e.target.closest('.term'); if (t) showTip(t); });
document.addEventListener('focusout',  e => { const t = e.target.closest('.term'); if (t && t === tipEl) hideTip(); });
document.addEventListener('keydown',   e => {
  if (e.key === 'Escape' && !tip.hidden) { const el = tipEl; hideTip(); if (el) el.blur(); }
});
/* follow the element rather than hiding: tabbing to a term scrolls it into
   view, and hiding on scroll would kill the tooltip the keyboard just opened */
let tipRAF = 0;
function trackTip(){
  if (tip.hidden || !tipEl) return;
  if (!tipEl.isConnected) { hideTip(); return; }
  if (tipRAF) return;
  tipRAF = requestAnimationFrame(() => { tipRAF = 0; placeTip(); });
}
window.addEventListener('scroll', trackTip, true);
window.addEventListener('resize', trackTip);

/* ---------- chart builders (HTML/CSS only — scaled SVG text renders wrong) ---------- */
function colChart(pairs){
  const max = Math.max.apply(null, pairs.map(p => p[1]).concat([1]));
  const bars = pairs.map(p =>
    '<div class="col"><div class="v">' + p[1] + '</div>' +
    '<div class="bar" style="height:' + (p[1] / max * 100).toFixed(1) + '%"></div></div>').join('');
  const labs = pairs.map(p => '<div>' + esc(p[0]) + '</div>').join('');
  return '<div class="cols">' + bars + '</div><div class="coldates">' + labs + '</div>';
}

function stackChart(counts, total){
  const segs = STATUS_ORDER.filter(k => counts[k]).map(k =>
    '<div class="seg" style="width:' + (counts[k] / total * 100).toFixed(2) + '%;background:' + STATUS[k].color +
    '" title="' + esc(STATUS[k].label) + ': ' + counts[k] + '"></div>').join('');
  const legend = STATUS_ORDER.map(k => {
    const n = counts[k] || 0;
    return '<li><span class="dot" style="background:' + STATUS[k].color + '"></span>' +
      '<span class="n">' + n + '</span>' +
      '<span><span class="lab">' + esc(STATUS[k].label) + '</span> — <span class="mean">' + ann(STATUS[k].mean) + '</span>' +
      (n ? '' : ' <span class="none">(none yet)</span>') + '</span></li>';
  }).join('');
  return '<div class="stack">' + segs + '</div><ul class="legend">' + legend + '</ul>';
}

function barChart(pairs){
  const max = Math.max.apply(null, pairs.map(p => p[1]).concat([1]));
  return '<div class="hbars">' + pairs.map(p =>
    '<div class="hbar' + (p[0] === UNRECORDED ? ' unrec' : '') + '"><div class="lab">' + ann(p[0]) + '</div>' +
    '<div class="track"><div class="fill" style="width:' + (p[1] / max * 100).toFixed(1) + '%"></div></div>' +
    '<div class="v">' + p[1] + '</div></div>').join('') + '</div>';
}

/* ---------- rows ---------- */
function rowHTML(r){
  const k = statusKey(r.status);
  const name = r.url
    ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.company) + '</a>'
    : esc(r.company);
  const role = r.role && r.role !== '—' ? '<div class="role">' + ann(r.role) + '</div>' : '';
  return '<tr>' +
    '<td><span class="co">' + name + '</span>' + role + '</td>' +
    '<td class="sal">' + ann(r.salary === '—' ? '' : r.salary) + '</td>' +
    '<td>' + ann(r.location === '—' ? '' : r.location) + '</td>' +
    '<td><span class="chip k-' + k + '">' + ann(r.status) + '</span></td>' +
    '<td class="sal">' + esc(r.date) + '</td>' +
    '<td class="note">' + ann(r.note) + '</td></tr>';
}
const TABLE_HEAD = '<tr><th>Company / Role</th><th>Salary</th><th>Location</th><th>Status</th><th>Date</th><th>Notes / Next</th></tr>';
const tableFor = rows => '<div class="wrap-x"><table>' + TABLE_HEAD + rows.map(rowHTML).join('') + '</table></div>';

/* ---------- tabs ---------- */
/* survives a re-render, so an hourly refresh doesn't yank the reader back to
   the Overview tab while they are reading the ledger */
let selectedTab = 0;
function wireTabs(){
  const tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
  function select(i, focus){
    selectedTab = i;
    tabs.forEach(function(t, j){
      const on = i === j;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
    if (focus) tabs[i].focus();
  }
  tabs.forEach(function(t, i){
    t.addEventListener('click', function(){ select(i); });
    t.addEventListener('keydown', function(e){
      const last = tabs.length - 1;
      let n = null;
      if (e.key === 'ArrowRight') n = i === last ? 0 : i + 1;
      if (e.key === 'ArrowLeft')  n = i === 0 ? last : i - 1;
      if (e.key === 'Home')       n = 0;
      if (e.key === 'End')        n = last;
      if (n !== null) { e.preventDefault(); select(n, true); }
    });
  });
  select(Math.min(selectedTab, tabs.length - 1));
}

/* ---------- render ---------- */
function render(d){
  const rows = d.sections.reduce((a, s) => a.concat(s.rows), []);
  const total = rows.length;
  const sb = d.meta.scoreboard;

  /* a) per day, chronological, derived from row.date */
  const byDay = {};
  rows.forEach(r => { byDay[r.date] = (byDay[r.date] || 0) + 1; });
  const dayPairs = Object.keys(byDay).map(k => [k, byDay[k]]).sort((a, b) => {
    const A = a[0].split('/').map(Number), B = b[0].split('/').map(Number);
    return A[0] - B[0] || A[1] - B[1];
  });
  const peak = Math.max.apply(null, dayPairs.map(p => p[1]));

  /* b) where all of them stand today */
  const counts = {};
  rows.forEach(r => { const k = statusKey(r.status); counts[k] = (counts[k] || 0) + 1; });
  const engaged = counts.engaged || 0;

  /* c) how they were sent — ranked, "Not recorded" always last */
  const byChan = {};
  rows.forEach(r => { const c = channel(r.note); byChan[c] = (byChan[c] || 0) + 1; });
  const chanPairs = Object.keys(byChan).map(k => [k, byChan[k]])
    .sort((a, b) => (a[0] === UNRECORDED) - (b[0] === UNRECORDED) || b[1] - a[1]);
  const unrec = byChan[UNRECORDED] || 0;

  const tiles = [
    [sb.applications_in, 'Applications in', ''],
    [sb.ats_confirmations, 'ATS confirmations', ''],
    [sb.live_conversations, 'Live conversation', 'hero'],
    [sb.human_replies, 'Human replies', ''],
    [sb.rejections, 'Rejections', ''],
    [sb.in_pipeline, 'In pipeline', ''],
    [sb.backlog, 'Backlog', '']
  ].map(t => '<div class="tile ' + t[2] + '"><div class="n">' + t[0] + '</div><div class="l">' + ann(t[1]) + '</div></div>').join('');

  /* replies & decisions = anything that produced an actual outcome */
  const outcomes = rows.filter(r => !/^submitted/i.test(String(r.status || '').trim()));

  const overview =
    '<div class="headline"><b>' + engaged + ' of ' + total + '</b> applications has produced a conversation with a ' +
      'human being. ' + (counts.submitted || 0) + ' were sent and never acknowledged by anyone at all. ' +
      'That is what this page is a record of.</div>' +

    '<div class="fig"><h3>Applications per day</h3>' + colChart(dayPairs) +
      '<div class="cap">Every application, counted on the day it was sent. The ' + peak + '-application day is one ' +
      'sustained push, not a typo — it matters because volume is the part of this process a candidate actually ' +
      'controls.</div></div>' +

    '<div class="fig"><h3>Where all ' + total + ' stand today</h3>' + stackChart(counts, total) +
      '<div class="cap">One bar, one application each. Colour and label always travel together here, because red and ' +
      'green are hard to tell apart for some readers — read the counts, not the hues. The green sliver is the point: ' +
      'it is what all the other colour is trying to become.</div></div>' +

    '<div class="fig"><h3>How applications were sent</h3>' + barChart(chanPairs) +
      '<div class="cap">Read from each entry’s own notes. ' + unrec + ' of ' + total + ' do not record how they ' +
      'were sent — they are shown as “' + UNRECORDED + '” in grey rather than quietly dropped, because ' +
      'hiding them would make the other numbers look more certain than they are.</div></div>' +

    '<div class="note-box quiet"><b>Not charted: company size.</b> The ledger has no <code>size</code> field on its ' +
      'rows, so a chart of big-company versus startup would be invented rather than counted. It needs a ' +
      '<code>size</code> value added per row in data.json first.</div>' +

    '<div class="note-box"><b>On the ' + sb.ats_confirmations + ' ATS confirmations:</b> ' + (counts.confirmed || 0) +
      ' entries currently show “Submitted ✓”. Two more (Rillet and Tsenta) were confirmed by an ATS and ' +
      'have since moved to a later status, so they count toward the ' + sb.ats_confirmations + ' but appear under ' +
      'their outcome above.</div>';

  const ledger = d.sections.map(sec => '<h2>' + ann(sec.title) + '</h2>' + tableFor(sec.rows)).join('');

  const repliesIntro = '<div class="note-box"><b>What counts as a reply.</b> These are the only entries that produced ' +
    'an actual outcome — a person, or a system, saying something other than nothing. Everything else in the ledger ' +
    'is still waiting.</div>';

  const glossary = Object.keys(GLOSSARY).map(group =>
    '<div class="gloss-group"><h2>' + esc(group) + '</h2><dl class="gloss-list">' +
    GLOSSARY[group].map(it =>
      '<div class="gloss-item"><dt>' + esc(it.term) + '</dt><dd>' + esc(it.definition) + '</dd></div>').join('') +
    '</dl></div>').join('');
  const termCount = new Set(TERMS.map(t => t.term)).size;

  document.getElementById('app').innerHTML =
    '<h1>' + esc(d.meta.name) + '</h1>' +
    '<div class="sub">' + esc(d.meta.subtitle) + '</div>' +
    '<div class="tiles">' + tiles + '</div>' +

    '<div class="tabs" role="tablist" aria-label="Views of the ledger">' +
      '<button role="tab" id="t-over" aria-controls="p-over">Overview</button>' +
      '<button role="tab" id="t-all"  aria-controls="p-all">Every application <span class="count">(' + total + ')</span></button>' +
      '<button role="tab" id="t-rep"  aria-controls="p-rep">Replies &amp; decisions <span class="count">(' + outcomes.length + ')</span></button>' +
      '<button role="tab" id="t-glo"  aria-controls="p-glo">Glossary <span class="count">(' + termCount + ')</span></button>' +
    '</div>' +

    '<div role="tabpanel" id="p-over" aria-labelledby="t-over" tabindex="0">' + overview + '</div>' +
    '<div role="tabpanel" id="p-all"  aria-labelledby="t-all"  tabindex="0" hidden>' + ledger + '</div>' +
    '<div role="tabpanel" id="p-rep"  aria-labelledby="t-rep"  tabindex="0" hidden>' + repliesIntro + tableFor(outcomes) + '</div>' +
    '<div role="tabpanel" id="p-glo"  aria-labelledby="t-glo"  tabindex="0" hidden>' + glossary + '</div>' +

    '<div class="note-box"><b>Standing rules:</b> ' + ann(d.standing_rules) + '</div>' +
    '<div class="updated">Last updated ' + ann(d.meta.updated) + ' · ' + ann(d.meta.counting_rule) +
      '<br><span id="checked" class="checked"></span></div>';

  wireTabs();
}

/* ---------- hourly refresh ----------
   The page is a live view of data.json, so an open tab should not go stale.
   It re-checks once an hour, re-renders only when the file actually changed,
   and keeps the reader's tab and scroll position when it does. */
const REFRESH_MS = 60 * 60 * 1000;
let lastRaw = '', lastCheck = 0, refreshTimer = 0;

function stampChecked(){
  const el = document.getElementById('checked');
  if (!el || !lastCheck) return;
  const mins = Math.floor((Date.now() - lastCheck) / 60000);
  el.textContent = 'Page re-checks the ledger every hour · ' +
    (mins < 1 ? 'checked just now' : mins === 1 ? 'checked 1 minute ago' : 'checked ' + mins + ' minutes ago');
}

function load(){
  return fetch('data.json?cb=' + Date.now(), { cache: 'no-store' })
    .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
    .then(raw => {
      lastCheck = Date.now();
      if (raw !== lastRaw) {
        lastRaw = raw;
        const y = window.scrollY;
        render(JSON.parse(raw));
        window.scrollTo(0, y);        // re-render must not move the reader
      }
      stampChecked();
    })
    .catch(e => {
      /* a failed re-check must never blank a page that is already showing data */
      if (!lastRaw) document.getElementById('app').innerHTML =
        '<p class="err">Could not load data.json — ' + esc(e.message) + '</p>';
    });
}

function scheduleRefresh(){
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => { load().then(scheduleRefresh); }, REFRESH_MS);
}

load().then(scheduleRefresh);
setInterval(stampChecked, 60000);
/* a backgrounded tab gets throttled, so catch up the moment it is looked at */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - lastCheck > REFRESH_MS) load();
});
</script>
</body>
</html>
