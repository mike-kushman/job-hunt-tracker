<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Hunt — Michael Kushman</title>
<style>
:root {
--bg: #0f1115; --card: #171a21; --line: #262b36;
--text: #e8eaf0; --dim: #9aa3b2;
--green: #34d399; --yellow: #fbbf24; --red: #f87171; --blue: #60a5fa; --purple: #c084fc;
}
@media (prefers-color-scheme: light) {
:root { --bg:#f6f7f9; --card:#ffffff; --line:#e3e6ec; --text:#1a1d24; --dim:#5b6472;
--green:#059669; --yellow:#b45309; --red:#dc2626; --blue:#2563eb; --purple:#7c3aed; }
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", Arial, sans-serif; padding: 24px; }
h1 { font-size: 20px; letter-spacing: -0.02em; }
.sub { color: var(--dim); font-size: 12px; margin: 4px 0 20px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin-bottom: 24px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile .n { font-size: 24px; font-weight: 700; }
.tile .l { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 26px 0 10px; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); padding: 10px 12px; border-bottom: 1px solid var(--line); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
.co { font-weight: 600; white-space: nowrap; }
.role { color: var(--dim); font-size: 12.5px; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.c-sub { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
.c-msg { background: color-mix(in srgb, var(--blue) 15%, transparent); color: var(--blue); }
.c-cold { background: color-mix(in srgb, var(--purple) 15%, transparent); color: var(--purple); }
.c-watch { background: color-mix(in srgb, var(--yellow) 15%, transparent); color: var(--yellow); }
.c-skip { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
.sal { white-space: nowrap; font-variant-numeric: tabular-nums; }
.note { color: var(--dim); font-size: 12px; }
.rules { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: 8px; padding: 12px 16px; color: var(--dim); font-size: 12.5px; margin-top: 26px; }
.rules b { color: var(--text); }
.updated { color: var(--dim); font-size: 11px; margin-top: 16px; }
.co a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
.co a:hover { color: var(--blue); }
.role a { color: inherit; text-decoration: underline dotted; }
.role a:hover { color: var(--blue); }
</style>
</head>
<body>
<div id="app"><p style="color:var(--dim)">Loading tracker…</p></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chipClass(status){
  const s = (status||'').toLowerCase();
  if (s.includes('rejected')) return 'c-skip';
  if (s.includes('submitted') || status.includes('✓')) return 'c-sub';
  if (s.includes('waas')) return 'c-msg';
  if (s.includes('emailed')) return 'c-cold';
  if (s.includes('bounced') || s.includes('skip')) return 'c-skip';
  return 'c-watch';
}
function coCell(r){
  const name = r.url ? `<a href="${esc(r.url)}">${esc(r.company)}</a>` : esc(r.company);
  const role = r.role && r.role !== '—' ? `<div class="role">${esc(r.role)}</div>` : '';
  return `<td><span class="co">${name}</span>${role}</td>`;
}
function render(d){
  const sb = d.meta.scoreboard;
  const tiles = [
    [sb.applications_in,'Applications in'],[sb.ats_confirmations,'ATS confirmations'],
    [sb.live_conversations,'Live conversation'],[sb.rejections,'Rejection'],
    [sb.in_pipeline,'In pipeline'],[sb.backlog,'Backlog'],
    [sb.cold_intros,'Cold intros sent'],[sb.skipped,'Skipped (bad fit)']
  ].map(([n,l]) => `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  const sections = d.sections.map(sec => {
    const rows = sec.rows.map(r => `<tr>${coCell(r)}<td class="sal">${esc(r.salary==='—'?'':r.salary)}</td><td>${esc(r.location==='—'?'':r.location)}</td><td><span class="chip ${chipClass(r.status)}">${esc(r.status)}</span></td><td class="sal">${esc(r.date)}</td><td class="note">${esc(r.note)}</td></tr>`).join('\n');
    return `<h2>${esc(sec.title)}</h2>\n<table><tr><th>Company / Role</th><th>Salary</th><th>Location</th><th>Status</th><th>Date</th><th>Notes / Next</th></tr>${rows}</table>`;
  }).join('\n');
  document.getElementById('app').innerHTML = `
    <h1>${esc(d.meta.name)}</h1>
    <div class="sub">${esc(d.meta.subtitle)}</div>
    <div class="tiles">${tiles}</div>
    ${sections}
    <div class="rules"><b>Standing rules:</b> ${esc(d.standing_rules)}</div>
    <div class="updated">Last updated ${esc(d.meta.updated)} · ${esc(d.meta.counting_rule)}</div>`;
}
fetch('data.json?cb=' + Date.now()).then(r => r.json()).then(render)
  .catch(e => { document.getElementById('app').innerHTML = '<p style="color:var(--red)">Could not load data.json — ' + esc(e.message) + '</p>'; });
</script>
</body>
</html>
